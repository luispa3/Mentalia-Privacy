<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayuda y contacto · Mentalia</title>
<style>
body{font:16px/1.65 system-ui,sans-serif;color:#27233f;background:#f7f5ff;margin:0}main{max-width:760px;margin:auto;padding:32px 22px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#6750ba}h1,h2{line-height:1.25}h1{font-size:32px}h2{font-size:21px}section{background:white;padding:24px;border-radius:18px;margin-top:22px}footer{margin-top:32px}form{display:grid;gap:10px}label{font-weight:600}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:12px;border:1px solid #dcd7eb}textarea{resize:vertical;min-height:160px}button{cursor:pointer;background:#6750ba;color:white;font-weight:700;border:0;min-height:48px;margin-top:12px}button:disabled{opacity:.6;cursor:wait}small{color:#625a74}.notice{box-sizing:border-box;width:calc(100% - 48px);max-width:420px;max-height:calc(100% - 64px);border:0;border-radius:22px;padding:22px;color:#27233f;background:#fff}.notice::backdrop{background:rgba(17,19,46,.6)}.notice h2{font-size:20px;font-weight:800;margin:0 0 15px}.notice p{font-size:14px;line-height:22px;margin:0 0 15px}.notice form{display:block}.notice button{margin:0;border-radius:12px}
</style>
</head>
<body><main>
<nav><a href="index.html">Privacidad</a><a href="support.html" aria-current="page">Soporte</a><a href="delete-account.html">Eliminar cuenta</a></nav>
<h1>Ayuda y contacto</h1>
<p>Cuéntanos qué necesitas y te responderemos por correo. No incluyas contraseñas ni códigos de acceso.</p>
<section><h2>Equipo de Mentalia</h2>
<form id="contact" novalidate>
<label for="email">Tu correo para responderte</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<label for="subject">Asunto</label><input id="subject" name="subject" minlength="3" maxlength="120" required>
<label for="message">Mensaje</label><textarea id="message" name="message" minlength="10" maxlength="4000" required></textarea>
<small>Usaremos tu correo y mensaje para atender tu consulta. Consulta los detalles en <a href="index.html">Privacidad</a>.</small>
<button id="send" type="submit">Enviar mensaje</button>
</form>
<noscript>Activa JavaScript para enviar el formulario. También puedes utilizar el contacto legal que figura en Privacidad.</noscript>
</section><footer>Equipo de Mentalia</footer>
</main>
<dialog id="notice" class="notice" aria-labelledby="notice-title" aria-describedby="notice-body"><h2 id="notice-title"></h2><p id="notice-body"></p><form method="dialog"><button type="submit">Entendido</button></form></dialog>
<script>
const form=document.getElementById('contact'),button=document.getElementById('send'),notice=document.getElementById('notice');
function showNotice(title,body){document.getElementById('notice-title').textContent=title;document.getElementById('notice-body').textContent=body;notice.showModal();}
notice.addEventListener('close',()=>{(form.querySelector(':invalid')||button).focus();});
if(new URLSearchParams(location.search).get('topic')==='account-deletion')form.elements.subject.value='Eliminar mi cuenta';
let sending=false;
form.addEventListener('submit',async event=>{
 event.preventDefault();if(sending)return;
 if(!form.checkValidity()){showNotice('Revisa el formulario','Indica un correo válido, un asunto de 3 a 120 caracteres y un mensaje de 10 a 4000 caracteres.');return;}
 sending=true;button.disabled=true;button.textContent='Enviando…';
 try{
  const response=await fetch('https://ilbrtudnakypxzwzaqrb.supabase.co/functions/v1/contact-support',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({email:form.elements.email.value.trim(),subject:form.elements.subject.value.trim(),message:form.elements.message.value.trim()}),
   signal:AbortSignal.timeout(30000)
  });
  const data=await response.json();
  if(!response.ok||data.sent!==true){
   showNotice(response.status===400?'Revisa el formulario':'No se ha podido enviar',response.status===429?'Hemos recibido muchos mensajes. Vuelve a intentarlo dentro de una hora.':response.status===400?'Revisa el correo, el asunto y el mensaje.':'Ahora no podemos enviar tu mensaje. Tu texto sigue en el formulario para que puedas volver a intentarlo. No se ha confirmado el envío.');
   return;
  }
  form.elements.subject.value='';form.elements.message.value='';showNotice('¡Mensaje enviado!','Te responderemos al correo que has indicado.');
 }catch{showNotice('No se ha podido enviar','No hemos podido confirmar el envío. Tu texto sigue en el formulario para que puedas intentarlo de nuevo.');}
 finally{sending=false;button.disabled=false;button.textContent='Enviar mensaje';}
});
</script></body></html>
